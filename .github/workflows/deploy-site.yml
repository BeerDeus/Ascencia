# Construit le site (vitrine + aperçu du jeu) et le publie dans la branche `hostinger`.
# Hostinger (hPanel > Avancé > Git) déploie cette branche sur ascencia.manaorbit.app.
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - run: npm test
      - name: Publier dans la branche hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./site-dist
          force_orphan: true
          enable_jekyll: true
          commit_message: 'Site'
