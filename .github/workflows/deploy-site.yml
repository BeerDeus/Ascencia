# Construit le site (vitrine + aperçu du jeu) et le publie dans la branche `hostinger`.
# Hostinger (hPanel > Avancé > Git) déploie cette branche sur ascencia.manaorbit.app.
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - run: npm test
      - name: Envoi FTP direct vers Hostinger (si configuré)
        id: ftp
        env:
          HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
        run: echo "ok=$HAS_FTP" >> "$GITHUB_OUTPUT"
      - if: steps.ftp.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site-dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
      - name: Publier dans la branche hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./site-dist
          keep_files: false
          enable_jekyll: true
          commit_message: 'Site'
