# Déploie les règles Firestore et les domaines autorisés d'Auth à chaque modification sur main.
# Nécessite le secret GitHub FIREBASE_SERVICE_ACCOUNT (clé JSON du compte de service).
name: Firebase (règles Firestore)

on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/firebase.yml, tools/firebase-deploy.mjs]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clé du compte de service
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT absent : rien n'est déployé"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Déployer
        if: steps.key.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cp tools/firebase-deploy.mjs firestore.rules "$RUNNER_TEMP/fb/"
          cd "$RUNNER_TEMP/fb" && npm init -y >/dev/null && npm i --silent google-auth-library@9
          node firebase-deploy.mjs firestore.rules
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
